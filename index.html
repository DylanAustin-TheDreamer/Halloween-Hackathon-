<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wizard's Library</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="game-body">
    <!--<div id="modal"></div>
		<button id="enter-library">
    	<img src="assets\images\Book-for-press.png" alt="Enter Library">
		</button>
		<button id="mute-button">
			<img src="assets\images\sound.png" alt="Mute/Unmute">
		</button>
		<div style="position: fixed; width: fit-content; height: 110px ; top: 75px; right: 100px; z-index: 1001;">

    <div class="overlay flex">
      <h1 style="color: rgb(211, 211, 211)">
        Welcome to the Wizard’s Riddles!
      </h1>
      <p style="color: rgb(211, 211, 211)">
        Ancient wisdom lies within these pages. Seek knowledge, and the secrets
        of the arcane will reveal themselves to you.
      </p>
      <div class="d-grid gap-2 col-4 mx-auto">
          <a class="btn" href="game.html">Play</a>
          <!-- Button trigger modal -->
          <button
            type="button"
            class="btn"
            data-bs-toggle="modal"
            data-bs-target="#how-to-play"
          >
            How to Play
          </button>

          <!-- Modal -->
          <div
            class="modal fade"
            id="how-to-play"
            tabindex="-1"
            aria-labelledby="how-to-play"
            aria-hidden="true"
          >
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h1 class="modal-title fs-5" id="modal-header">
                    How to Play
                  </h1>
                  <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                  ></button>
                </div>
                <div class="modal-body">...</div>
                <div class="modal-footer">
                  <button type="button" class="btn" data-bs-dismiss="modal">
                    Close
                  </button>
                </div>
              </div>
            </div>
          </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="assets/js/start.js"></script>
  </body>
</html>
